<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกไมล์ (ทดสอบ)</title>
<!-- nco-tools/mileage/index.html — LIFF 2011953085-84eBr79k · API = GAS project nco-dsr-app (doPost) · R5 spike -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--o:#E8631A;--o-lite:#FEF0E7;--g:#007B40;--r:#C8102E;--ink:#1A1A1A;--ink3:#8A8A8A;--bg:#F7F5F2}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink)}
.top{background:var(--o);color:#fff;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.top b{font-size:19px}
.wrap{padding:14px;max-width:520px;margin:0 auto}
.step{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid rgba(0,0,0,.08)}
.step h4{margin:0 0 6px;font-size:15px}
.res{font-size:13px;white-space:pre-wrap;word-break:break-all}
.ok{color:var(--g)} .bad{color:var(--r)} .mut{color:var(--ink3)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-size:16px;font-weight:600;background:var(--o);color:#fff;margin-top:8px}
.btn.sec{background:var(--o-lite);color:var(--o)}
.btn:disabled{opacity:.45}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:8px}
.cam video,.cam canvas{display:block;width:100%}
.frame{position:absolute;left:10%;width:80%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px}
img.pv{width:100%;border-radius:10px;margin-top:8px;background:#eee}
</style>
</head>
<body>
<div class="top"><b>📷 บันทึกไมล์ — ทดสอบระบบ</b><div style="font-size:13px;opacity:.9">ยังไม่บันทึกเลขไมล์จริง</div></div>
<div class="wrap">
  <div class="step"><h4>1. เปิดใน LINE</h4><div class="res" id="r1">กำลังเริ่ม…</div></div>
  <div class="step"><h4>2. ตรวจตัวตนกับระบบ</h4><div class="res" id="r2">รอข้อ 1</div></div>
  <div class="step"><h4>3. กล้อง + กรอบเล็ง</h4>
    <div class="res" id="r3">แตะเปิดกล้อง แล้ววางเลขไมล์ให้อยู่ในกรอบ</div>
    <div class="cam" id="cam" style="display:none"><video id="vid" playsinline autoplay muted></video><div class="frame" id="frm"></div><div class="hint">วางเลขไมล์ให้อยู่ในกรอบ</div></div>
    <button class="btn" id="bCam" disabled>เปิดกล้อง</button>
    <button class="btn" id="bShot" style="display:none">ถ่าย</button>
    <label class="btn sec" style="text-align:center">หรือถ่ายด้วยกล้องเครื่อง<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
    <img class="pv" id="crop" style="display:none" alt="">
  </div>
  <div class="step"><h4>4. อัปโหลดรูป (Drive)</h4><div class="res" id="r4">รอรูปจากข้อ 3</div><img class="pv" id="pub" style="display:none" alt=""></div>
  <div class="step"><h4>5. ส่งการ์ดเข้ากลุ่ม</h4><div class="res" id="r5">รอข้อ 4 · ต้องเปิดจากในกลุ่ม LINE</div><button class="btn" id="bSend" disabled>ส่งการ์ดทดสอบ</button></div>
  <button class="btn sec" id="bCopy">คัดลอกผลทดสอบ (ส่งให้ภูมิ)</button>
</div>
<script>
var LIFF_ID = '2011953085-84eBr79k';
var API = 'https://script.google.com/macros/s/AKfycbwbTwQCqyN-AqpsZbBPQlH0buXw7y5JYnW7K80JedLyWma37-uBfz_1AblILRvr-9C1RA/exec';
var FRAME = { x: .10, w: .80, ratio: 3 };   // กรอบกว้าง 80% ของภาพ อัตราส่วน 3:1 อยู่กลางภาพ
var LOG = [], ME = null, IMG_URL = '', stream = null;

function $(i){ return document.getElementById(i); }
function put(id, txt, cls){ var e = $(id); e.className = 'res ' + (cls || ''); e.textContent = txt; LOG.push('[' + id + '] ' + txt); }
function api(action, extra){
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  return fetch(API, { method: 'POST', body: JSON.stringify(body) })   // text/plain → ไม่มี CORS preflight
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error); return j.data; });
}

// 1. LIFF
liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()) { liff.login(); return; }
  var c = liff.getContext() || {};
  return liff.getProfile().then(function(p){
    put('r1', 'OK · ' + p.displayName + '\nOS: ' + liff.getOS() + ' · ในแอป LINE: ' + liff.isInClient() +
      ' · LINE ' + (liff.getLineVersion() || '-') + '\nเปิดจาก: ' + (c.type || '-') + (c.type === 'group' ? ' ✓' : ' (ต้องเป็น group ถึงส่งการ์ดได้)') +
      '\nuserId: ' + p.userId, 'ok');
    $('bCam').disabled = false;
    return api('whoami').then(function(u){ ME = u; put('r2', 'OK · ระบบรู้จักว่าเป็น ' + u.name + ' (' + u.role + ')', 'ok'); },
                              function(e){ put('r2', 'ไม่ผ่าน: ' + e.message, 'bad'); });
  });
}).catch(function(e){ put('r1', 'เริ่ม LIFF ไม่ได้: ' + e.message, 'bad'); });

// 3. กล้อง (getUserMedia + กรอบเล็ง)
function placeFrame(){
  var v = $('vid'), f = $('frm'), h = v.clientWidth * FRAME.w / FRAME.ratio;
  f.style.height = h + 'px'; f.style.top = (v.clientHeight - h) / 2 + 'px';
}
$('bCam').onclick = function(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { put('r3', 'เครื่องนี้เปิดกล้องในแอปไม่ได้ (ไม่มี getUserMedia) — ใช้ปุ่มกล้องเครื่องแทน', 'bad'); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false })
    .then(function(s){
      stream = s; var v = $('vid'); v.srcObject = s; $('cam').style.display = 'block';
      $('bCam').style.display = 'none'; $('bShot').style.display = 'block';
      v.onloadedmetadata = function(){ placeFrame(); put('r3', 'กล้องในแอปใช้ได้ ✓ ' + v.videoWidth + '×' + v.videoHeight, 'ok'); };
    }, function(e){ put('r3', 'เปิดกล้องในแอปไม่ได้: ' + e.name + ' ' + e.message + ' — ใช้ปุ่มกล้องเครื่องแทน', 'bad'); });
};
$('bShot').onclick = function(){ var v = $('vid'); cropFrom(v, v.videoWidth, v.videoHeight, 'live'); };
$('file').onchange = function(){
  var f = this.files[0]; if (!f) return;
  var img = new Image(); img.onload = function(){ cropFrom(img, img.naturalWidth, img.naturalHeight, 'file'); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};
// ตัดเฉพาะในกรอบ → JPEG กว้างไม่เกิน 1200
function cropFrom(src, W, H, how){
  var cw = W * FRAME.w, ch = cw / FRAME.ratio, cx = W * FRAME.x, cy = (H - ch) / 2;
  var outW = Math.min(1200, Math.round(cw)), outH = Math.round(outW / FRAME.ratio);
  var c = document.createElement('canvas'); c.width = outW; c.height = outH;
  c.getContext('2d').drawImage(src, cx, cy, cw, ch, 0, 0, outW, outH);
  var data = c.toDataURL('image/jpeg', .85);
  $('crop').src = data; $('crop').style.display = 'block';
  put('r3', 'ถ่ายแล้ว (' + how + ') ภาพเต็ม ' + W + '×' + H + ' → ตัดกรอบ ' + outW + '×' + outH + ' · ' + Math.round(data.length * .75 / 1024) + ' KB', 'ok');
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; $('cam').style.display = 'none'; $('bShot').style.display = 'none'; $('bCam').style.display = 'block'; }
  upload(data);
}

// 4. อัปโหลด → Drive public → ลองแสดงจาก URL สาธารณะ
function upload(data){
  put('r4', 'กำลังอัปโหลด…', 'mut');
  var t0 = Date.now();
  api('spikeUpload', { image: data }).then(function(r){
    put('r4', 'อัปโหลดแล้ว ' + ((Date.now() - t0) / 1000).toFixed(1) + ' วิ · กำลังเปิดรูปจากลิงก์สาธารณะ…', 'mut');
    var img = $('pub'); img.style.display = 'block';
    img.onload = function(){ IMG_URL = r.url; put('r4', 'รูปสาธารณะแสดงได้ ✓ (' + r.url + ')', 'ok'); $('bSend').disabled = false; };
    img.onerror = function(){ put('r4', 'เปิดรูปจาก lh3 ไม่ได้ — ลอง uc?export=view', 'bad');
      img.onerror = function(){ put('r4', 'เปิดรูปสาธารณะไม่ได้ทั้ง 2 แบบ', 'bad'); };
      img.onload = function(){ IMG_URL = r.alt; put('r4', 'รูปแสดงได้ด้วย uc?export=view ✓', 'ok'); $('bSend').disabled = false; };
      img.src = r.alt; };
    img.src = r.url;
  }, function(e){ put('r4', 'อัปโหลดไม่ผ่าน: ' + e.message, 'bad'); });
}

// 5. Flex card ในนาม DSR
$('bSend').onclick = function(){
  var now = new Date(), hm = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  var name = ME ? ME.name : 'ทดสอบ';
  var msg = { type: 'flex', altText: '🚗 ' + name + ' ทดสอบบันทึกไมล์ ' + hm, contents: { type: 'bubble',
    hero: { type: 'image', url: IMG_URL, size: 'full', aspectRatio: '3:1', aspectMode: 'cover' },
    body: { type: 'box', layout: 'vertical', spacing: 'xs', contents: [
      { type: 'text', text: '🚗 ' + name + ' · ออกงาน ' + hm + ' น.', weight: 'bold', size: 'md' },
      { type: 'text', text: '123,456 กม. ✓', weight: 'bold', size: 'xl', color: '#E8631A' },
      { type: 'text', text: 'ทดสอบระบบ — ไม่ใช่เลขจริง', size: 'xs', color: '#8A8A8A' } ] } } };
  liff.sendMessages([msg]).then(function(){ put('r5', 'ส่งแล้ว ✓ — ดูในกลุ่มว่าการ์ด + รูปขึ้น และขึ้นในชื่อ ' + name, 'ok'); },
    function(e){ put('r5', 'ส่งไม่ได้: ' + (e.code || '') + ' ' + e.message, 'bad'); });
};

$('bCopy').onclick = function(){
  var t = 'LIFF spike ' + new Date().toLocaleString('th-TH') + '\n' + LOG.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ alert('คัดลอกแล้ว'); },
    function(){ prompt('คัดลอกข้อความนี้', t); });
};
</script>
</body>
</html>
