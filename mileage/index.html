<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกไมล์</title>
<!-- nco-tools/mileage/index.html — LIFF 2011953085-84eBr79k · API = GAS project nco-dsr-app (doPost → Liff.js / Mileage.js) · R5 -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--o:#E8631A;--o-d:#C44E0E;--o-l:#FEF0E7;--g:#007B40;--g-l:#E2F4ED;--r:#C8102E;--y:#FFF6DB;--y-d:#8A5A00;--ink:#1A1A1A;--ink2:#4A4A4A;--ink3:#8A8A8A;--bg:#F7F5F2;--card:#fff;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',sans-serif;font-size:16px}
.top{background:var(--o);color:#fff;padding:14px 16px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.top .t{font-size:13px;opacity:.9}.top b{font-size:20px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.today{display:flex;gap:8px}
#vCam .card{padding:10px 12px;margin-bottom:10px}
#vCam .seg{margin-top:8px}#vCam .seg button{padding:8px}
.today div{flex:1;border-radius:10px;padding:8px 10px;background:var(--bg)}
.today small{display:block;font-size:12px;color:var(--ink3)}
.today b{font-size:17px}.today .done{background:var(--g-l)}.today .done b{color:var(--g)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:10px;border-radius:9px;color:var(--ink2)}
.seg button.on{background:var(--o);color:#fff}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;height:min(56vh,480px)}
.cam video{display:block;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:5%;width:90%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.4)}
.hint{position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
.shut{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--o);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.shut:disabled{opacity:.4}
.link{display:block;text-align:center;color:var(--o-d);font-weight:600;font-size:15px;padding:12px}
.compact .top{padding-bottom:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-size:17px;font-weight:700;background:var(--o);color:#fff;margin-top:10px;text-align:center}
.btn.sec{background:var(--o-l);color:var(--o-d);font-weight:600}
.btn.ghost{background:none;color:var(--ink2);font-weight:600;padding:10px}
.btn:disabled{opacity:.45}
.shot{width:100%;border-radius:12px;display:block;background:#222}
.num{width:100%;font:inherit;font-size:38px;font-weight:700;text-align:center;letter-spacing:1px;border:2px solid var(--o);border-radius:12px;padding:8px;margin-top:10px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font:inherit;font-size:16px;font-weight:600}
.chip.on{background:var(--o-l);border-color:var(--o);color:var(--o-d)}
.mut{color:var(--ink3);font-size:13px;text-align:center;margin-top:8px}
.warn{background:var(--y);color:var(--y-d);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.err{background:#fdecee;color:var(--r);border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px;word-break:break-word}
.ok{text-align:center;padding:26px 8px}
.ok .big{font-size:44px;font-weight:700;color:var(--g)}
.spin{width:28px;height:28px;border:3px solid var(--o-l);border-top-color:var(--o);border-radius:50%;animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="t" id="hdrSub">Nice Center Oil · บันทึกไมล์</div><b id="hdrName">📷 บันทึกไมล์</b></div>
<div class="wrap">
  <div id="err" class="err hide"></div>
  <div id="vLoad"><div class="spin"></div><div class="mut">กำลังเปิด…</div></div>

  <!-- 1 เลือกช่วง + ถ่าย -->
  <section id="vCam" class="hide">
    <div class="card">
      <div class="today">
        <div id="tdM"><small>เริ่มงาน</small><b>-</b></div>
        <div id="tdE"><small>เลิกงาน</small><b>-</b></div>
      </div>
      <div class="seg"><button id="sM" onclick="setSes('morning')">เริ่มงาน</button><button id="sE" onclick="setSes('evening')">เลิกงาน</button></div>
    </div>
    <div class="cam" id="cam"><video id="vid" playsinline autoplay muted></video><div class="frame" id="frm"></div>
      <div class="hint">ให้เลขไมล์อยู่ในกรอบ ไม่ต้องเป๊ะ</div><button class="shut" id="bShot" aria-label="ถ่าย" disabled></button></div>
    <label class="link" id="lFile">ใช้กล้องเครื่องแทน<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  </section>

  <!-- 2 ยืนยันเลข -->
  <section id="vConfirm" class="hide">
    <img class="shot" id="shot" alt="">
    <div id="reading"><div class="spin"></div><div class="mut">กำลังอ่านเลขไมล์…</div></div>
    <div id="pick" class="hide">
      <div class="mut" id="pickHint"></div>
      <input class="num" id="num" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="พิมพ์เลขไมล์">
      <div class="chips" id="chips"></div>
      <div class="mut" id="anchorTxt"></div>
      <div id="warnBox" class="warn hide"></div>
      <button class="btn" id="bSave">ยืนยัน <span id="sesTxt"></span></button>
      <button class="btn ghost" onclick="retake()">ถ่ายใหม่</button>
    </div>
  </section>

  <!-- 3 เสร็จ -->
  <section id="vDone" class="hide">
    <div class="card ok">
      <div class="big">✓</div>
      <div style="font-size:18px;font-weight:700;margin-top:6px" id="doneTxt"></div>
      <div class="mut" id="doneSub"></div>
    </div>
    <button class="btn" onclick="liff.closeWindow()">ปิด</button>
  </section>
</div>
<script>
var LIFF_ID = '2011953085-84eBr79k';
var API = 'https://script.google.com/macros/s/AKfycbwbTwQCqyN-AqpsZbBPQlH0buXw7y5JYnW7K80JedLyWma37-uBfz_1AblILRvr-9C1RA/exec';
var FRAME = { x: .05, w: .90, ratio: 2.5 };          // กรอบหลวม (Poom: เลขไมล์มักชิดเลขอื่น)
var JUMP = 1000, DAY = 500;                          // ต้องตรงกับ Mileage.js
var INIT = null, SES = 'morning', READ = null, stream = null, busy = false;
var TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var SES_TH = { morning: 'เริ่มงาน', evening: 'เลิกงาน' };

function $(i){ return document.getElementById(i); }
function show(v){ ['vLoad','vCam','vConfirm','vDone'].forEach(function(x){ $(x).classList.toggle('hide', x !== v); }); window.scrollTo(0, 0); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function dTh(ymd){ var p = ymd.split('-').map(Number); return p[2] + ' ' + TH_M[p[1]-1]; }
function err(m){ var e = $('err'); e.textContent = m; e.classList.remove('hide'); }
function clearErr(){ $('err').classList.add('hide'); }
function api(action, extra){
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  return fetch(API, { method: 'POST', body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.ok) return j.data;
      if (/^AUTH/.test(j.error)) { liff.logout(); liff.login(); }   // token หมดอายุ → login ใหม่
      throw new Error(j.error);
    });
}

// ── เริ่ม ────────────────────────────────────────────────────
liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()) { liff.login(); return; }
  return api('mile.init').then(function(d){
    INIT = d;
    $('hdrName').textContent = '📷 ' + d.name + (d.vehicle ? ' · ' + d.vehicle : '');
    $('hdrSub').textContent = 'บันทึกไมล์ · ' + dTh(d.today) + (d.role === 'test' ? ' · เครื่องทดสอบ (ไม่บันทึกจริง)' : '');
    paintToday(); setSes(d.session); show('vCam'); startCam();
  });
}).catch(function(e){ show('vCam'); $('vCam').classList.add('hide'); err('เปิดไม่ได้: ' + e.message); });

function paintToday(){
  [['tdM', INIT.todayMorning], ['tdE', INIT.todayEvening]].forEach(function(x){
    var el = $(x[0]); el.classList.toggle('done', !!x[1]); el.querySelector('b').textContent = x[1] ? fmt(x[1]) + ' ✓' : '-';
  });
}
function setSes(s){ SES = s; $('sM').classList.toggle('on', s === 'morning'); $('sE').classList.toggle('on', s === 'evening'); }

// ── กล้อง ────────────────────────────────────────────────────
function startCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { noLiveCam(); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
    .then(function(s){
      stream = s; var v = $('vid'); v.srcObject = s;
      v.onloadedmetadata = function(){ placeFrame(); $('bShot').disabled = false; };
    }, noLiveCam);
}
function noLiveCam(){ $('cam').classList.add('hide'); $('lFile').className = 'btn'; $('lFile').firstChild.textContent = '📸 ถ่ายเลขไมล์'; }
function stopCam(){ if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } }
function placeFrame(){ var c = $('cam'), f = $('frm'), h = c.clientWidth * FRAME.w / FRAME.ratio; f.style.height = h + 'px'; f.style.top = (c.clientHeight - h) / 2 - 20 + 'px'; }
// กรอบบนจอ → พิกัดบนวิดีโอจริง (object-fit: cover ขยายวิดีโอเต็มกล่องแล้วตัดขอบ)
function frameOnVideo(){
  var v = $('vid'), c = $('cam'), f = $('frm');
  var bw = c.clientWidth, bh = c.clientHeight, vw = v.videoWidth, vh = v.videoHeight;
  var s = Math.max(bw / vw, bh / vh), ox = (bw - vw * s) / 2, oy = (bh - vh * s) / 2;
  return { x: (f.offsetLeft - ox) / s, y: (f.offsetTop - oy) / s, w: f.offsetWidth / s, h: f.offsetHeight / s };
}
window.addEventListener('resize', function(){ if (stream) placeFrame(); });
$('bShot').onclick = function(){ var v = $('vid'); crop(v, v.videoWidth, v.videoHeight, frameOnVideo()); };
$('file').onchange = function(){
  var f = this.files[0]; if (!f) return; this.value = '';
  var img = new Image(); img.onload = function(){ crop(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};
// ตัดตามกรอบ ไม่ย่อ (เว้นกว้างเกิน 1600) — เลขจะชัดสุด
function crop(src, W, H, r){   // r = พื้นที่กรอบบนภาพ (กล้องในแอป) · ไม่มี = กลางภาพ (กล้องเครื่อง)
  var cw = r ? r.w : W * FRAME.w, ch = r ? r.h : cw / FRAME.ratio, cx = r ? r.x : W * FRAME.x, cy = r ? r.y : (H - ch) / 2;
  var ow = Math.min(1600, Math.round(cw)), oh = Math.round(ow / FRAME.ratio);
  var c = document.createElement('canvas'); c.width = ow; c.height = oh;
  c.getContext('2d').drawImage(src, cx, cy, cw, ch, 0, 0, ow, oh);
  var data = c.toDataURL('image/jpeg', .88);
  stopCam(); clearErr();
  $('shot').src = data; $('reading').classList.remove('hide'); $('pick').classList.add('hide');
  $('sesTxt').textContent = SES_TH[SES]; show('vConfirm');
  READ = null;
  api('mile.read', { image: data, session: SES }).then(function(r){ READ = r; showPick(); },
    function(e){ err('อ่านรูปไม่สำเร็จ: ' + e.message); READ = { candidates: [], fileId: '', url: '' }; showPick(); });
}
function retake(){ clearErr(); show('vCam'); startCam(); }

// ── เลือก/แก้เลข ─────────────────────────────────────────────
function showPick(){
  $('reading').classList.add('hide'); $('pick').classList.remove('hide');
  var c = READ.candidates || [];
  $('num').value = c.length ? c[0].mile : '';
  $('pickHint').textContent = c.length ? 'เลขที่อ่านได้ — ถ้าไม่ตรง แตะตัวเลือกหรือพิมพ์แก้' : 'อ่านเลขไม่ออก — พิมพ์เลขไมล์ตามรูป';
  $('chips').innerHTML = c.slice(0, 3).map(function(x, i){ return '<button class="chip' + (i === 0 ? ' on' : '') + '" data-m="' + x.mile + '">' + fmt(x.mile) + '</button>'; }).join('') +
    '<button class="chip" data-m="">พิมพ์เอง</button>';
  [].forEach.call($('chips').children, function(b){ b.onclick = function(){
    [].forEach.call($('chips').children, function(x){ x.classList.remove('on'); }); b.classList.add('on');
    $('num').value = b.dataset.m; if (!b.dataset.m) $('num').focus(); checkWarn(); }; });
  var a = INIT.anchor;
  $('anchorTxt').textContent = a ? 'เลขล่าสุดที่ยืนยัน ' + fmt(a.mile) + ' (' + dTh(a.date) + ' ' + SES_TH[a.session] + ')' : '';
  if (!c.length) $('num').focus();
  checkWarn();
}
$('num').oninput = function(){ this.value = this.value.replace(/\D/g, '').slice(0, 7); checkWarn(); };
function warnings(m){
  var w = [], a = INIT.anchor;
  if (!m) return w;
  if (a && m < a.mile) w.push('น้อยกว่าเลขล่าสุด ' + fmt(a.mile));
  if (a && m - a.mile > JUMP) w.push('มากกว่าเลขล่าสุด ' + fmt(m - a.mile) + ' กม.');
  if (SES === 'evening' && INIT.todayMorning && m - INIT.todayMorning > DAY) w.push('วันนี้วิ่ง ' + fmt(m - INIT.todayMorning) + ' กม.');
  return w;
}
function checkWarn(){
  var m = parseInt($('num').value, 10), w = warnings(m), b = $('warnBox');
  b.classList.toggle('hide', !w.length);
  b.innerHTML = w.length ? '⚠️ ' + w.join('<br>⚠️ ') + '<br><small>ตรวจเลขกับรูปอีกครั้ง ถ้าถูกแล้วกดยืนยันได้</small>' : '';
  $('bSave').disabled = !(m > 0);
}

// ── บันทึก + การ์ดเข้ากลุ่ม ──────────────────────────────────
$('bSave').onclick = function(){ save(false); };
function save(ack){
  if (busy) return;
  var m = parseInt($('num').value, 10); if (!(m > 0)) return;
  var top = (READ.candidates || [])[0];
  var w = warnings(m);
  if (w.length && !ack && !confirm('เลขนี้ผิดปกติ:\n• ' + w.join('\n• ') + '\n\nยืนยันว่าเลข ' + fmt(m) + ' ถูกต้อง?')) return;
  busy = true; $('bSave').disabled = true; $('bSave').textContent = 'กำลังบันทึก…';
  api('mile.save', { session: SES, mile: m, fileId: READ.fileId, raw: top ? top.mile : '',
                     source: top && top.mile === m ? 'vision' : 'manual', ack: true })
    .then(function(r){ return sendCard(r, m).then(function(sent){ done(r, m, sent); }); })
    .catch(function(e){ err('บันทึกไม่สำเร็จ: ' + e.message); })
    .then(function(){ busy = false; $('bSave').disabled = false; $('bSave').innerHTML = 'ยืนยัน <span id="sesTxt">' + SES_TH[SES] + '</span>'; });
}
function sendCard(r, m){
  var ctx = liff.getContext() || {};
  if (!READ.url || ['group', 'room', 'utou'].indexOf(ctx.type) < 0) return Promise.resolve(false);
  var now = new Date(), hm = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  var lines = [
    { type: 'text', text: '🚗 ' + INIT.name + ' · ' + SES_TH[SES] + ' ' + hm + ' น.', weight: 'bold', size: 'md', wrap: true },
    { type: 'text', text: fmt(m) + ' กม. ✓', weight: 'bold', size: 'xl', color: '#E8631A' } ];
  if (r.distance) lines.push({ type: 'text', text: 'วันนี้วิ่ง ' + fmt(r.distance) + ' กม.', size: 'sm', color: '#4A4A4A' });
  if (r.warnings && r.warnings.length) lines.push({ type: 'text', text: '⚠️ ' + r.warnings.join(' · ') + ' (ยืนยันแล้ว)', size: 'xs', color: '#8A5A00', wrap: true });
  if (r.dryRun) lines.push({ type: 'text', text: 'ทดสอบระบบ — ไม่ได้บันทึกจริง', size: 'xs', color: '#8A8A8A' });
  return liff.sendMessages([{ type: 'flex', altText: '🚗 ' + INIT.name + ' ' + SES_TH[SES] + ' ' + fmt(m) + ' กม.', contents: { type: 'bubble',
    hero: { type: 'image', url: READ.url, size: 'full', aspectRatio: '5:2', aspectMode: 'cover' },
    body: { type: 'box', layout: 'vertical', spacing: 'xs', contents: lines } } }])
    .then(function(){ return true; }, function(){ return false; });
}
function done(r, m, sent){
  $('doneTxt').textContent = (r.dryRun ? 'ทดสอบ · ' : '') + SES_TH[SES] + ' ' + fmt(m) + ' กม.';
  $('doneSub').textContent = (r.distance ? 'วันนี้วิ่ง ' + fmt(r.distance) + ' กม. · ' : '') +
    (sent ? 'ส่งการ์ดเข้ากลุ่มแล้ว' : 'บันทึกแล้ว (ไม่ได้ส่งการ์ด — เปิดจากลิงก์ในกลุ่มเลขไมล์)');
  if (!r.dryRun) { if (SES === 'morning') INIT.todayMorning = m; else INIT.todayEvening = m; INIT.anchor = { mile: m, date: INIT.today, session: SES }; }
  show('vDone');
}
</script>
</body>
</html>
