<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>บันทึกไมล์</title>
<!-- nco-tools/mileage/index.html — LIFF 2011953085-84eBr79k · API = GAS project nco-dsr-app (doPost → Liff.js / Mileage.js) · R5 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* CI เดียวกับแอป nco-dsr-app: พื้นเทาอมเขียว · การ์ดขาวขอบบาง · ส้ม NCO เฉพาะปุ่มหลัก · เส้นสามสีใต้หัว = ตัวบอกกำลังโหลด */
:root{--o:#E8631A;--o-d:#B9480B;--o-l:#FDEEE4;--g:#00843D;--g-l:#E3F3EA;--r:#D2232A;--r-l:#FCEBEC;--y:#FFF4DC;--y-d:#8A5A00;
  --ink:#18211D;--ink2:#4B5652;--ink3:#87918D;--bg:#F3F5F4;--card:#fff;--line:#E3E7E5;--line2:#D3D9D6;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai Looped',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.appbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;height:56px;padding:0 14px 0 16px}
.ab-t{flex:1;min-width:0;line-height:1.2}
.ab-t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-t small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-me{width:34px;height:34px;border-radius:50%;background:var(--o-l);color:var(--o-d);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.stripe{position:sticky;top:56px;z-index:5;height:3px;display:flex;overflow:hidden;background:var(--line)}
.stripe i{flex:1}.stripe i:nth-child(1){background:var(--g)}.stripe i:nth-child(2){background:var(--r)}.stripe i:nth-child(3){background:var(--o)}
.stripe.busy i{animation:run 1.1s var(--ease) infinite}.stripe.busy i:nth-child(2){animation-delay:.12s}.stripe.busy i:nth-child(3){animation-delay:.24s}
@keyframes run{0%{transform:translateX(-100%)}60%{transform:translateX(0)}100%{transform:translateX(100%)}}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
section{animation:enter .22s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.today{display:flex;gap:8px}
#vCam .card{padding:10px 12px;margin-bottom:10px}
#vCam .seg{margin-top:8px}#vCam .seg button{padding:8px}
.today div{flex:1;border-radius:10px;padding:8px 10px;background:var(--bg)}
.today small{display:block;font-size:12px;color:var(--ink3)}
.today b{font-size:17px;font-variant-numeric:tabular-nums}.today .done{background:var(--g-l)}.today .done b{color:var(--g)}
.seg{display:flex;gap:4px;margin-top:10px}
.seg button{flex:1;border:1px solid var(--line2);background:var(--card);font-weight:600;padding:10px;border-radius:10px;color:var(--ink2);transition:background .15s,color .15s,border-color .15s}
.seg button.on{background:var(--o);border-color:var(--o);color:#fff}
.cam{touch-action:none;-webkit-user-select:none;user-select:none;position:relative;background:#000;border-radius:14px;overflow:hidden;height:min(56vh,480px)}
.cam video{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center center;transition:transform .08s linear}
.frame{position:absolute;left:5%;width:90%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.4)}
.hint{position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
.shut{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--o);box-shadow:0 2px 12px rgba(0,0,0,.4);transition:transform .1s var(--ease)}
.shut:active{transform:translateX(-50%) scale(.92)}
.shut:disabled{opacity:.4}
.zoom{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700}
.zoom button.on{background:#fff;color:var(--ink)}
.zlbl{position:absolute;left:12px;bottom:34px;color:#fff;font-size:14px;font-weight:700;background:rgba(0,0,0,.45);border-radius:8px;padding:3px 8px}
.link{display:block;text-align:center;color:var(--o-d);font-weight:600;font-size:15px;padding:12px}
.btn{position:relative;display:block;width:100%;border:1px solid var(--o);border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:var(--o);color:#fff;
  margin-top:10px;text-align:center;box-shadow:0 2px 8px rgba(232,99,26,.28);transition:transform .1s var(--ease),background .15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);border-color:var(--line2);color:var(--ink);box-shadow:none}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2);box-shadow:none;padding:10px}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:sp .7s linear infinite}
.shot{width:100%;border-radius:12px;display:block;background:#222}
.num{width:100%;font-size:38px;font-weight:700;text-align:center;letter-spacing:1px;border:1px solid var(--line2);border-radius:12px;padding:8px;margin-top:10px;color:var(--ink);background:#fff;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
.num:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px var(--o-l)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:7px 14px;font-size:16px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.on{background:var(--o-l);border-color:var(--o);color:var(--o-d)}
.mut{color:var(--ink3);font-size:13px;text-align:center;margin-top:8px}
.warn{background:var(--y);color:var(--y-d);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.err{background:var(--r-l);color:var(--r);border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px;word-break:break-word}
.ok{text-align:center;padding:26px 8px}
.ok .big{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:700;animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.spin{width:28px;height:28px;border:3px solid var(--o-l);border-top-color:var(--o);border-radius:50%;animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--o);margin-right:4px;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="appbar"><div class="ab-t"><b id="hdrName">บันทึกไมล์</b><small id="hdrSub">Nice Center Oil</small></div><span class="ab-me" id="hdrMe" aria-hidden="true"></span></header>
<div class="stripe" id="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <div id="err" class="err hide"></div>
  <div id="vLoad"><div class="spin"></div><div class="mut">กำลังเปิด…</div></div>

  <!-- 1 เลือกช่วง + ถ่าย -->
  <section id="vCam" class="hide">
    <div class="card">
      <div class="today">
        <div id="tdM"><small>เริ่มงาน</small><b>-</b></div>
        <div id="tdE"><small>เลิกงาน</small><b>-</b></div>
      </div>
      <div class="seg"><button id="sM" onclick="setSes('morning')">เริ่มงาน</button><button id="sE" onclick="setSes('evening')">เลิกงาน</button></div>
    </div>
    <div class="cam" id="cam"><video id="vid" playsinline autoplay muted></video><div class="frame" id="frm"></div>
      <div class="hint">ให้เลขไมล์อยู่ในกรอบ ไม่ต้องเป๊ะ</div><button class="shut" id="bShot" aria-label="ถ่าย" disabled></button>
      <div class="zoom" id="zoomBtns"><button data-z="1">1×</button><button data-z="2">2×</button><button data-z="3">3×</button></div>
      <div class="zlbl" id="zLbl">1.0×</div></div>
    <label class="link" id="lFile">ใช้กล้องเครื่องแทน<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  </section>

  <!-- 2 ยืนยันเลข -->
  <section id="vConfirm" class="hide">
    <img class="shot" id="shot" alt="">
    <div id="pick">
      <div class="mut" id="pickHint"></div>
      <input class="num" id="num" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="พิมพ์เลขไมล์">
      <div class="chips" id="chips"></div>
      <div class="mut" id="anchorTxt"></div>
      <div id="warnBox" class="warn hide"></div>
      <button class="btn" id="bSave">ยืนยัน <span id="sesTxt"></span></button>
      <button class="btn sec" onclick="retake()">ถ่ายใหม่</button>
    </div>
  </section>

  <!-- 3 เสร็จ -->
  <section id="vDone" class="hide">
    <div class="card ok">
      <div class="big">✓</div>
      <div style="font-size:18px;font-weight:700;margin-top:6px" id="doneTxt"></div>
      <div class="mut" id="doneSub"></div>
    </div>
    <button class="btn" onclick="liff.closeWindow()">ปิด</button>
  </section>
</div>
<script>
var LIFF_ID = '2011953085-84eBr79k';
var API = 'https://script.google.com/macros/s/AKfycbwbTwQCqyN-AqpsZbBPQlH0buXw7y5JYnW7K80JedLyWma37-uBfz_1AblILRvr-9C1RA/exec';
var FRAME = { x: .05, w: .90, ratio: 2.5 };          // กรอบหลวม (Poom: เลขไมล์มักชิดเลขอื่น)
var JUMP = 1000, DAY = 500;                          // ต้องตรงกับ Mileage.js
var INIT = null, SES = 'morning', READ = null, IMG = '', SHOT_T = 0, stream = null, busy = false;
var TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var SES_TH = { morning: 'เริ่มงาน', evening: 'เลิกงาน' };

function $(i){ return document.getElementById(i); }
function show(v){ ['vLoad','vCam','vConfirm','vDone'].forEach(function(x){ $(x).classList.toggle('hide', x !== v); }); window.scrollTo(0, 0); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function dTh(ymd){ var p = ymd.split('-').map(Number); return p[2] + ' ' + TH_M[p[1]-1]; }
function err(m){ var e = $('err'); e.textContent = m; e.classList.remove('hide'); }
function clearErr(){ $('err').classList.add('hide'); }
var PENDING = 0;
function netBusy(d){ PENDING = Math.max(0, PENDING + d); $('stripe').classList.toggle('busy', PENDING > 0); }
function api(action, extra){
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  netBusy(1);
  return fetch(API, { method: 'POST', body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ netBusy(-1); return j; }, function(e){ netBusy(-1); throw e; })
    .then(function(j){
      if (j.ok) return j.data;
      if (/^AUTH/.test(j.error)) { liff.logout(); liff.login(); }   // token หมดอายุ → login ใหม่
      throw new Error(j.error);
    });
}

// ── เริ่ม ────────────────────────────────────────────────────
liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()) { liff.login(); return; }
  return api('mile.init').then(function(d){
    INIT = d;
    $('hdrName').textContent = d.name + (d.vehicle ? ' · ' + d.vehicle : '');
    $('hdrMe').textContent = String(d.name || '?').charAt(0);
    $('hdrSub').textContent = 'บันทึกไมล์ · ' + dTh(d.today) + (d.role === 'test' ? ' · เครื่องทดสอบ (ไม่บันทึกจริง)' : '');
    paintToday(); setSes(d.session); show('vCam'); startCam();
  });
}).catch(function(e){ show('vCam'); $('vCam').classList.add('hide'); err('เปิดไม่ได้: ' + e.message); });

function paintToday(){
  [['tdM', INIT.todayMorning], ['tdE', INIT.todayEvening]].forEach(function(x){
    var el = $(x[0]); el.classList.toggle('done', !!x[1]); el.querySelector('b').textContent = x[1] ? fmt(x[1]) + ' ✓' : '-';
  });
}
function setSes(s){ SES = s; $('sM').classList.toggle('on', s === 'morning'); $('sE').classList.toggle('on', s === 'evening'); }

// ── กล้อง ────────────────────────────────────────────────────
function startCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { noLiveCam(); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
    .then(function(s){
      stream = s; var v = $('vid'); v.srcObject = s;
      var tr = s.getVideoTracks()[0], caps = tr && tr.getCapabilities ? tr.getCapabilities() : {};
      HWZ = caps.zoom && caps.zoom.max > caps.zoom.min ? { track: tr, min: caps.zoom.min, max: Math.min(caps.zoom.max, 5 * caps.zoom.min) } : null;
      v.onloadedmetadata = function(){ placeFrame(); setZoom(ZOOM); $('bShot').disabled = false; };
    }, noLiveCam);
}
function noLiveCam(){ $('cam').classList.add('hide'); $('lFile').className = 'btn'; $('lFile').firstChild.textContent = '📸 ถ่ายเลขไมล์'; }
function stopCam(){ if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } }
function placeFrame(){ var c = $('cam'), f = $('frm'), h = c.clientWidth * FRAME.w / FRAME.ratio; f.style.height = h + 'px'; f.style.top = (c.clientHeight - h) / 2 - 20 + 'px'; }
// กรอบบนจอ → พิกัดบนวิดีโอจริง (object-fit: cover ขยายวิดีโอเต็มกล่องแล้วตัดขอบ)
function frameOnVideo(){
  var v = $('vid'), c = $('cam'), f = $('frm');
  var bw = c.clientWidth, bh = c.clientHeight, vw = v.videoWidth, vh = v.videoHeight;
  var s = Math.max(bw / vw, bh / vh) * (HWZ ? 1 : ZOOM), ox = (bw - vw * s) / 2, oy = (bh - vh * s) / 2;
  return { x: (f.offsetLeft - ox) / s, y: (f.offsetTop - oy) / s, w: f.offsetWidth / s, h: f.offsetHeight / s };
}
window.addEventListener('resize', function(){ if (stream) placeFrame(); });

// ── ซูม: กล้องที่รองรับ (ส่วนใหญ่ Android) ใช้ซูมของกล้องจริง · ไม่รองรับ (iPhone) ขยายภาพ แล้วตัดรูปตามกรอบที่เห็น
var ZOOM = 1, HWZ = null, Z_MAX = 4;
function setZoom(z){
  var max = HWZ ? HWZ.max / HWZ.min : Z_MAX;
  ZOOM = Math.max(1, Math.min(max, z));
  if (HWZ) { HWZ.track.applyConstraints({ advanced: [{ zoom: HWZ.min * ZOOM }] }).catch(function(){}); $('vid').style.transform = ''; }
  else $('vid').style.transform = ZOOM > 1 ? 'scale(' + ZOOM + ')' : '';
  $('zLbl').textContent = ZOOM.toFixed(1) + '×';
  [].forEach.call($('zoomBtns').children, function(b){ b.classList.toggle('on', Math.abs(+b.dataset.z - ZOOM) < .05); });
}
[].forEach.call($('zoomBtns').children, function(b){ b.onclick = function(){ setZoom(+b.dataset.z); }; });
// ถ่างสองนิ้วบนภาพ = ซูมกล้อง (ไม่ใช่ซูมทั้งหน้า)
// iPhone: LINE/Safari ส่ง gesturestart/gesturechange และจะซูมทั้งหน้าถ้าไม่ preventDefault → ใช้ e.scale
// Android: ไม่มี gesture event → คำนวณจากระยะสองนิ้วใน touchmove
(function(){
  var d0 = 0, z0 = 1, iosGesture = false, cam = $('cam');
  function dist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false });   // กันซูมทั้งหน้าทุกที่
  });
  cam.addEventListener('gesturestart', function(e){ iosGesture = true; z0 = ZOOM; e.preventDefault(); }, { passive: false });
  cam.addEventListener('gesturechange', function(e){ e.preventDefault(); setZoom(z0 * e.scale); }, { passive: false });
  cam.addEventListener('touchstart', function(e){ if (e.touches.length === 2) { d0 = dist(e.touches); z0 = ZOOM; } }, { passive: true });
  cam.addEventListener('touchmove', function(e){
    if (e.touches.length !== 2) return;
    e.preventDefault();
    if (!iosGesture && d0) setZoom(z0 * dist(e.touches) / d0);
  }, { passive: false });
  cam.addEventListener('touchend', function(e){ if (e.touches.length < 2) d0 = 0; });
})();
$('bShot').onclick = function(){ var v = $('vid'); crop(v, v.videoWidth, v.videoHeight, frameOnVideo()); };
$('file').onchange = function(){
  var f = this.files[0]; if (!f) return; this.value = '';
  var img = new Image(); img.onload = function(){ crop(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};
// ตัดตามกรอบ แล้วย่อกว้างไม่เกิน 1000px คุณภาพ 80% — เล็กลง 2–3 เท่า Vision ยังอ่านเลขได้ (ใช้รูปเดียวกันในการ์ด)
function crop(src, W, H, r){   // r = พื้นที่กรอบบนภาพ (กล้องในแอป) · ไม่มี = กลางภาพ (กล้องเครื่อง)
  var cw = r ? r.w : W * FRAME.w, ch = r ? r.h : cw / FRAME.ratio, cx = r ? r.x : W * FRAME.x, cy = r ? r.y : (H - ch) / 2;
  var ow = Math.min(1000, Math.round(cw)), oh = Math.round(ow / FRAME.ratio);
  var c = document.createElement('canvas'); c.width = ow; c.height = oh;
  c.getContext('2d').drawImage(src, cx, cy, cw, ch, 0, 0, ow, oh);
  IMG = c.toDataURL('image/jpeg', .8);
  stopCam(); clearErr();
  $('shot').src = IMG; $('sesTxt').textContent = SES_TH[SES]; show('vConfirm');
  // ช่องตัวเลขพร้อมทันที — DSR พิมพ์เองได้เลย ไม่ต้องรอ OCR; อ่านเสร็จค่อยเติมเลขให้ (ถ้ายังไม่ได้พิมพ์)
  READ = { candidates: [], pending: true }; SHOT_T = Date.now();
  $('num').value = ''; showPick();
  var mine = SHOT_T;
  api('mile.read', { image: IMG, session: SES }).then(function(r){
    if (mine !== SHOT_T) return;   // ถ่ายใหม่ไปแล้ว
    console.log('mile.read', Date.now() - mine, 'ms', r.ms);
    READ = r; showPick();
  }, function(e){
    if (mine !== SHOT_T) return;
    READ = { candidates: [], failed: true }; showPick();
    console.log('mile.read fail', e.message);
  });
}
function retake(){ clearErr(); show('vCam'); startCam(); }

// ── เลือก/แก้เลข ─────────────────────────────────────────────
function showPick(){
  var c = READ.candidates || [], typed = !!$('num').value && !READ._filled;
  if (!typed && c.length) { $('num').value = c[0].mile; READ._filled = true; }
  $('pickHint').innerHTML = READ.pending ? '<span class="dot"></span> กำลังอ่านเลขจากรูป… พิมพ์เองได้เลยไม่ต้องรอ'
    : c.length ? 'เลขที่อ่านได้ — ถ้าไม่ตรง แตะตัวเลือกหรือพิมพ์แก้'
    : READ.failed ? 'อ่านรูปไม่สำเร็จ — พิมพ์เลขไมล์ตามรูป' : 'อ่านเลขไม่ออก — พิมพ์เลขไมล์ตามรูป';
  $('chips').innerHTML = READ.pending ? '' : c.slice(0, 3).map(function(x){
      return '<button class="chip' + (String(x.mile) === $('num').value ? ' on' : '') + '" data-m="' + x.mile + '">' + fmt(x.mile) + '</button>'; }).join('') +
    '<button class="chip" data-m="">พิมพ์เอง</button>';
  [].forEach.call($('chips').children, function(b){ b.onclick = function(){
    [].forEach.call($('chips').children, function(x){ x.classList.remove('on'); }); b.classList.add('on');
    $('num').value = b.dataset.m; if (!b.dataset.m) $('num').focus(); checkWarn(); }; });
  var a = INIT.anchor;
  $('anchorTxt').textContent = a ? 'เลขล่าสุดที่ยืนยัน ' + fmt(a.mile) + ' (' + dTh(a.date) + ' ' + SES_TH[a.session] + ')' : '';
  if (!READ.pending && !c.length && !$('num').value) $('num').focus();
  checkWarn();
}
$('num').oninput = function(){ this.value = this.value.replace(/\D/g, '').slice(0, 7); if (READ) READ._filled = false; checkWarn(); };
function warnings(m){
  var w = [], a = INIT.anchor;
  if (!m) return w;
  if (a && m < a.mile) w.push('น้อยกว่าเลขล่าสุด ' + fmt(a.mile));
  if (a && m - a.mile > JUMP) w.push('มากกว่าเลขล่าสุด ' + fmt(m - a.mile) + ' กม.');
  if (SES === 'evening' && INIT.todayMorning && m - INIT.todayMorning > DAY) w.push('วันนี้วิ่ง ' + fmt(m - INIT.todayMorning) + ' กม.');
  return w;
}
function checkWarn(){
  var m = parseInt($('num').value, 10), w = warnings(m), b = $('warnBox');
  b.classList.toggle('hide', !w.length);
  b.innerHTML = w.length ? '⚠️ ' + w.join('<br>⚠️ ') + '<br><small>ตรวจเลขกับรูปอีกครั้ง ถ้าถูกแล้วกดยืนยันได้</small>' : '';
  $('bSave').disabled = !(m > 0);
}

// ── บันทึก + การ์ดเข้ากลุ่ม ──────────────────────────────────
$('bSave').onclick = function(){ save(false); };
function save(ack){
  if (busy) return;
  var m = parseInt($('num').value, 10); if (!(m > 0)) return;
  var top = (READ.candidates || [])[0];
  var w = warnings(m);
  if (w.length && !ack && !confirm('เลขนี้ผิดปกติ:\n• ' + w.join('\n• ') + '\n\nยืนยันว่าเลข ' + fmt(m) + ' ถูกต้อง?')) return;
  busy = true; $('bSave').disabled = true; $('bSave').classList.add('busy');
  api('mile.save', { session: SES, mile: m, image: IMG, raw: top ? top.mile : '',
                     source: top && top.mile === m ? 'vision' : 'manual', ack: true })
    .then(function(r){ return sendCard(r, m).then(function(sent){ done(r, m, sent); }); })
    .catch(function(e){ err('บันทึกไม่สำเร็จ: ' + e.message); })
    .then(function(){ busy = false; $('bSave').disabled = false; $('bSave').classList.remove('busy'); });
}
function sendCard(r, m){
  var ctx = liff.getContext() || {};
  if (!r.url || ['group', 'room', 'utou'].indexOf(ctx.type) < 0) return Promise.resolve(false);
  var now = new Date(), hm = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  var lines = [
    { type: 'text', text: '🚗 ' + INIT.name + ' · ' + SES_TH[SES] + ' ' + hm + ' น.', weight: 'bold', size: 'md', wrap: true },
    { type: 'text', text: fmt(m) + ' กม. ✓', weight: 'bold', size: 'xl', color: '#E8631A' } ];
  if (r.distance) lines.push({ type: 'text', text: 'วันนี้วิ่ง ' + fmt(r.distance) + ' กม.', size: 'sm', color: '#4A4A4A' });
  if (r.warnings && r.warnings.length) lines.push({ type: 'text', text: '⚠️ ' + r.warnings.join(' · ') + ' (ยืนยันแล้ว)', size: 'xs', color: '#8A5A00', wrap: true });
  if (r.dryRun) lines.push({ type: 'text', text: 'ทดสอบระบบ — ไม่ได้บันทึกจริง', size: 'xs', color: '#8A8A8A' });
  return liff.sendMessages([{ type: 'flex', altText: '🚗 ' + INIT.name + ' ' + SES_TH[SES] + ' ' + fmt(m) + ' กม.', contents: { type: 'bubble',
    hero: { type: 'image', url: r.url, size: 'full', aspectRatio: '5:2', aspectMode: 'cover' },
    body: { type: 'box', layout: 'vertical', spacing: 'xs', contents: lines } } }])
    .then(function(){ return true; }, function(){ return false; });
}
function done(r, m, sent){
  $('doneTxt').textContent = (r.dryRun ? 'ทดสอบ · ' : '') + SES_TH[SES] + ' ' + fmt(m) + ' กม.';
  $('doneSub').textContent = (r.distance ? 'วันนี้วิ่ง ' + fmt(r.distance) + ' กม. · ' : '') +
    (sent ? 'ส่งการ์ดเข้ากลุ่มแล้ว' : 'บันทึกแล้ว (ไม่ได้ส่งการ์ด — เปิดจากลิงก์ในกลุ่มเลขไมล์)');
  if (!r.dryRun) { if (SES === 'morning') INIT.todayMorning = m; else INIT.todayEvening = m; INIT.anchor = { mile: m, date: INIT.today, session: SES }; }
  show('vDone');
}
</script>
